<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wilhelm_renderer — text (WebAssembly)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="wilhelm-canvas"></canvas>
  <!-- Serve the REPO ROOT (python3 -m http.server 8000) and open
       /examples/wasm/text/web/ — the module loads straight from target/,
       no copy step. The font is fetched over the network before wasm_init. -->
  <script>
    window.WILHELM_WASM =
      "../../../../target/wasm32-unknown-unknown/release/text_wasm.wasm";
    window.WILHELM_ASSETS = ["../../../../fonts/DejaVuSans.ttf"];
  </script>
  <script src="../../../../wilhelm_renderer_sys/js/webglrenderer.js"></script>
</body>
</html>
