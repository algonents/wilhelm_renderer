[package]
name = "wilhelm_renderer"
version = "0.13.0"
edition = "2021"
authors = ["Anwar Ludin <anwar.ludin@algonents.com>"]
license = "MIT"

description = "A minimalist 2D graphics engine"
repository = "https://github.com/algonents/wilhelm-renderer"
readme = "README.md"
keywords = ["opengl", "visualization", "2d", "graphics", "renderer"]
categories = ["visualization", "rendering::engine", "graphics"]
exclude = [
    ".idea/",
    "images/",
    "CLAUDE.md",
    "MEMORY PERFORMANCE.md",
    "OPENGL.md",
    "ROADMAP.md",
    "TODO.md",
    "examples/",
    # DejaVuSans is only used by examples (which are already excluded).
    # The lib test uses the much smaller ArchitectsDaughter font.
    "fonts/DejaVuSans.ttf",
]

[dependencies]
# default-features off: the defaults pull in rayon (no wasm support) and the
# rav1e AV1 encoder — ~130 extra lockfile packages. PNG is the only format
# the engine and examples use (see docs/DESIGN_WASM.md item 8).
image = { version = "0.25.6", default-features = false, features = ["png"] }
# Pure-Rust text stack (replaces the bundled FreeType). Both crates have
# zero required dependencies; ttf-parser is trimmed to core table parsing.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
ab_glyph_rasterizer = "0.1"
wilhelm_renderer_sys = { path = "wilhelm_renderer_sys", version = "=0.11.0" }

[workspace]
members = [
    ".",
    "wilhelm_renderer_sys",
    "examples/anchor_rotations",
    "examples/alpha_transparency",
    "examples/dashed_lines",
    "examples/bouncing_balls",
    "examples/bouncing_balls_instanced",
    "examples/wasm/bouncing_balls",
    "examples/wasm/bouncing_balls_instanced",
    "examples/wasm/input",
    "examples/instancing",
    "examples/polygons",
    "examples/keyboard",
    "examples/rotations",
    "examples/shapes",
    "examples/shapes_scaled",
    "examples/wasm/shapes",
    "examples/wasm/shapes_scaled",
    "examples/wasm/text",
    "examples/wasm/text_sdf",
    "examples/text_sdf",
    "examples/markers",
    "examples/style_mutation",
    "examples/text",
    "examples/transforms",
    "examples/triangle",
    "examples/waypoints",
    "examples/waypoints_instanced",
    "examples/window",
    "examples/z_order",
]
